user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 22m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/before-choosing.access.log safe;

    server {
        listen 80 default_server;
        server_name 8.133.214.65;
        location ^~ /.well-known/acme-challenge/ { root /var/lib/before-choosing-acme; }
        location / { return 301 https://8.133.214.65$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name 8.133.214.65;
        ssl_certificate /etc/letsencrypt/live/8.133.214.65/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/8.133.214.65/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        root /opt/before-choosing/current/frontend;
        index index.html;

        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=auth burst=10 nodelay;
            limit_conn connections 20;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn connections 30;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Queue wait is outside the upstream timeout, but the HTTP request
            # remains open while it waits. Allow three waves of five-user demo
            # traffic at two in-flight requests and a 180s upstream deadline.
            proxy_read_timeout 720s;
            proxy_send_timeout 720s;
            proxy_buffering off;
        }
        location ~ /\. { deny all; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
